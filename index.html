#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(30px + var(--safeB))}

/* 상단 */
.bar{display:flex;align-items:center;gap:12px;padding:calc(14px + var(--safeT)) 16px 12px}
.back{border:none;background:#EDF2F1;width:46px;height:46px;border-radius:23px;font-size:22px;
  color:var(--ink);cursor:pointer;flex:none;line-height:1}
.bar h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.5px}
.step{font-size:15px;color:var(--mute);font-weight:700;margin-left:auto;flex:none}

/* 요일 헤더 */
.dayhd{background:var(--day);color:var(--dayOn);padding:calc(26px + var(--safeT)) 22px 26px;
  border-radius:0 0 26px 26px}
.dayhd .d1{font-size:16px;font-weight:800;opacity:.9}
.dayhd .d2{font-size:40px;font-weight:800;letter-spacing:-1px;margin-top:6px;line-height:1.15}
.dayhd .d3{font-size:16px;margin-top:10px;opacity:.92;font-weight:600}

.pad{padding:20px 16px 0}
.big{display:flex;align-items:center;gap:16px;width:100%;background:#fff;border:2px solid var(--line);
  border-radius:20px;padding:22px 20px;margin-bottom:14px;cursor:pointer;text-align:left}
.big .ic{width:52px;height:52px;border-radius:16px;background:#EDF2F1;display:grid;place-items:center;
  font-size:24px;font-weight:800;color:var(--teal);flex:none}
.big .t{font-size:22px;font-weight:800;letter-spacing:-.4px}
.big .s{font-size:15px;color:var(--mute);margin-top:4px}
.big .n{margin-left:auto;font-size:17px;font-weight:800;color:var(--teal);flex:none}

.btn{border:none;border-radius:16px;padding:20px;font-size:20px;font-weight:800;cursor:pointer;
  background:var(--ink);color:#fff;width:100%;display:block}
.btn.day{background:var(--day);color:var(--dayOn)}
.btn.g{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.s{padding:14px;font-size:17px}
.btn:disabled{opacity:.35}
.gap{height:12px}

.q{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.35;margin:6px 0 8px}
.hint{font-size:16px;color:var(--mute);line-height:1.6;margin:0 0 20px}
.inp,.ta{width:100%;font-size:19px;padding:18px;border:2px solid var(--line);border-radius:16px;
  outline:none;background:#fff;color:var(--ink);line-height:1.6}
.ta{resize:none}
.inp:focus,.ta:focus{border-color:var(--teal)}

.item{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);
  border-radius:16px;padding:16px 18px;margin-bottom:10px;cursor:pointer}
.item .nm{font-size:20px;font-weight:700}
.item .sub{font-size:14.5px;color:var(--mute);margin-top:3px}
.item .go{margin-left:auto;color:var(--mute);font-size:20px;flex:none}
.item img{width:52px;height:52px;border-radius:14px;object-fit:cover;flex:none}
.item .ini{width:52px;height:52px;border-radius:14px;background:#EDF2F1;display:grid;place-items:center;
  font-size:20px;font-weight:800;color:var(--teal);flex:none}

.chk{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);
  border-radius:16px;padding:19px 18px;margin-bottom:11px;cursor:pointer}
.chk.on{background:var(--day);border-color:var(--day);color:var(--dayOn)}
.chk .bx{width:30px;height:30px;border-radius:9px;border:2.5px solid var(--line);flex:none;
  display:grid;place-items:center;font-size:17px;background:#fff;color:var(--day);font-weight:900}
.chk.on .bx{border-color:#fff;background:#fff}
.chk .lb{font-size:19px;font-weight:700}

.note{background:#EDF2F1;border-radius:18px;padding:22px;margin-bottom:16px}
.note b{display:block;font-size:19px;font-weight:800;margin-bottom:8px}
.note p{margin:0;font-size:16px;color:var(--body);line-height:1.75}

.drop{border:2.5px dashed var(--line);border-radius:18px;padding:26px 18px;text-align:center;background:#fff}
.drop b{display:block;font-size:19px;font-weight:700;margin-bottom:14px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.photo{width:100%;border-radius:16px;display:block}
.rec{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:10px}
.rec .dt{font-size:14.5px;font-weight:800;color:var(--day)}
.rec .ln{font-size:16px;color:var(--body);margin-top:7px;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{background:#EDF2F1;border-radius:12px;padding:5px 11px;font-size:13.5px;font-weight:700;color:var(--teal)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(40px + var(--safeB));
  background:var(--ink);color:#fff;padding:15px 24px;border-radius:26px;font-size:17px;font-weight:700;z-index:90}
.cover img{width:100%;display:block}
.cover .in{padding:8px 20px 30px}
.instbox{background:#fff;border:2px solid var(--day);border-radius:20px;padding:20px;margin-bottom:16px}
.instbox b{display:block;font-size:19px;font-weight:800;margin-bottom:8px}
.instbox p{margin:0 0 14px;font-size:15.5px;color:var(--body);line-height:1.75}
.instbox .steps{background:#F3F7F6;border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.9;
  color:var(--ink);margin-bottom:14px}
.instbox .close{font-size:14.5px;color:var(--mute);text-align:center;margin-top:6px}
.pill{display:inline-block;background:#EDF2F1;color:var(--teal);border-radius:14px;padding:6px 13px;
  font-size:14px;font-weight:800;margin-bottom:14px}
.mini{font-size:14.5px;color:var(--mute);line-height:1.65;margin-top:14px}
.copybox{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;
  font-size:15px;line-height:1.75;white-space:pre-line;color:var(--body);margin-bottom:12px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<input type="file" accept="image/*" capture="environment" id="camIn" style="display:none">
<input type="file" accept="image/*" id="fileIn" style="display:none">

<script>
/* ═══ 요일 색 (무지개) ═══ */
var DAYS = [
  {k:'일요일', s:'일', c:'#8B47C9', on:'#ffffff'},
  {k:'월요일', s:'월', c:'#D93F45', on:'#ffffff'},
  {k:'화요일', s:'화', c:'#EE6A1B', on:'#ffffff'},
  {k:'수요일', s:'수', c:'#EFB100', on:'#3A2A00'},
  {k:'목요일', s:'목', c:'#2E9E5B', on:'#ffffff'},
  {k:'금요일', s:'금', c:'#2B6FE8', on:'#ffffff'},
  {k:'토요일', s:'토', c:'#3B3FA8', on:'#ffffff'}
];
function dayOf(ds){ return DAYS[new Date(ds+'T00:00:00').getDay()]; }

/* ═══ 상태 ═══ */
var S = {me:'', people:[]};
var V = {screen:'home', pid:null, draft:null};

function load(){ try{ var d=JSON.parse(localStorage.getItem('minasa2')); if(d){S.me=d.me||'';S.people=d.people||[];} }catch(e){} }
function save(){ try{ localStorage.setItem('minasa2', JSON.stringify(S)); }catch(e){} }
function uid(){ return Math.random().toString(36).slice(2,9); }
function today(){ var d=new Date(); return d.toISOString().slice(0,10); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function md(ds){ var d=new Date(ds+'T00:00:00'); return (d.getMonth()+1)+'월 '+d.getDate()+'일'; }
function mdShort(ds){ var d=new Date(ds+'T00:00:00'); return (d.getMonth()+1)+'/'+d.getDate(); }
function person(id){ for(var i=0;i<S.people.length;i++) if(S.people[i].id===id) return S.people[i]; return null; }
function toast(m){ var t=document.getElementById('toast');
  t.innerHTML='<div class="toast">'+esc(m)+'</div>'; setTimeout(function(){t.innerHTML='';},2200); }
function allLogs(){
  var out=[]; S.people.forEach(function(p){ (p.logs||[]).forEach(function(l){ out.push({p:p,l:l}); }); });
  return out.sort(function(a,b){ return a.l.date<b.l.date?1:-1; });
}
function setDayVars(ds){
  var d=dayOf(ds||today());
  document.documentElement.style.setProperty('--day', d.c);
  document.documentElement.style.setProperty('--dayOn', d.on);
  var m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content', d.c);
}
function go(sc, pid){ V.screen=sc; if(pid!==undefined) V.pid=pid; render(); window.scrollTo(0,0); }

/* ═══ 화면 ═══ */
function render(){
  setDayVars(V.draft ? V.draft.date : today());
  var app=document.getElementById('app');
  var f = ({home:scHome, list:scList, add:scAdd, person:scPerson,
            s1:scS1, s2:scS2, s3:scS3, s4:scS4, s5:scS5, card:scCard,
            next:scNext, copy:scCopy})[V.screen] || scHome;
  app.innerHTML = f();
  bind();
}
function head(title, backTo, step){
  return '<div class="bar"><button class="back" data-go="'+backTo+'">‹</button>'
    + '<h1>'+esc(title)+'</h1>'
    + (step?'<div class="step">'+step+'</div>':'') + '</div>';
}

/* 홈 */
function scHome(){
  if(!S.me){
    return '<div class="cover"><img src="'+cover()+'" alt="미나사 캠페인">'
      + '<div class="in"><p class="hint" style="margin-top:14px">이름을 넣고 시작하세요.<br>'
      + '기록은 이 휴대폰에만 저장됩니다.</p>'
      + '<input id="nameIn" class="inp" placeholder="이름" style="margin-bottom:12px">'
      + '<button class="btn day" id="nameGo">시작하기</button></div></div>';
  }
  var d=dayOf(today());
  var logs=allLogs();
  var week=logs.filter(function(x){ return x.l.date >= addD(today(),-6); }).length;
  var nexts=S.people.filter(function(p){ return p.next && p.next.date; }).length;
  return '<div class="dayhd"><div class="d1">미나사(미네랄을 나누는 사람들) 챌린지</div>'
    + '<div class="d2">'+md(today())+'<br>'+d.k+'</div>'
    + '<div class="d3">'+esc(S.me)+'님 · 이번 주 '+week+'번 기록했어요</div></div>'
    + '<div class="pad">'
    + '<button class="big" data-go="list"><div class="ic">1</div>'
    + '<div><div class="t">명단 작성</div><div class="s">전할 사람을 적어둡니다</div></div>'
    + '<div class="n">'+S.people.length+'명</div></button>'
    + '<button class="big" data-go="pickPerson"><div class="ic">2</div>'
    + '<div><div class="t">전달 기록</div><div class="s">만나서 주고받은 말을 남깁니다</div></div>'
    + '<div class="n">'+logs.length+'건</div></button>'
    + '<button class="big" data-go="next"><div class="ic">3</div>'
    + '<div><div class="t">다음 만남</div><div class="s">언제 다시 볼지 정해둡니다</div></div>'
    + '<div class="n">'+nexts+'명</div></button>'
    + '<div class="gap"></div>'
    + installBox()
    + '<div class="mini" id="resetName">이름 바꾸기</div>'
    + '</div>';
}
function isApp(){
  try{
    if(navigator.standalone===true) return true;
    if(window.matchMedia) return window.matchMedia('(display-mode: standalone)').matches;
  }catch(e){}
  return false;
}
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
function hideInstall(){ try{ return localStorage.getItem('minasa2:noinst')==='1'; }catch(e){ return false; } }
function installBox(){
  if(isApp() || hideInstall()) return '';
  var steps = isIOS()
    ? '1. 화면 아래 <b>공유 버튼</b>(↑)을 누르세요<br>'
      + '2. 목록을 내려서 <b>홈 화면에 추가</b>를 누르세요<br>'
      + '3. 오른쪽 위 <b>추가</b>를 누르면 끝'
    : '1. 화면 오른쪽 위 <b>⋮</b> 을 누르세요<br>'
      + '2. <b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누르세요<br>'
      + '3. <b>추가</b>를 누르면 끝';
  return '<div class="instbox"><b>홈 화면에 바로가기 만들기</b>'
    + '<p>한 번만 해두시면 다음부터는 아이콘만 눌러서 바로 열 수 있어요.</p>'
    + '<div class="steps">'+steps+'</div>'
    + '<button class="btn day s" id="instNow">지금 바로 만들기</button>'
    + '<div class="close" id="instNo">이미 만들었어요 · 다시 안 보기</div></div>';
}
function addD(ds,n){ var d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

/* 1. 명단 */
function scList(){
  var h = head('명단','home');
  h += '<div class="pad">';
  if(!S.people.length){
    h += '<div class="note"><b>전할 사람을 적어보세요</b><p>이름만 적으면 됩니다. '
      + '제일 편한 사람부터 적으세요. 열 명이 목표입니다.</p></div>';
  }else{
    S.people.forEach(function(p){
      var n=(p.logs||[]).length;
      h += '<div class="item" data-person="'+p.id+'">'
        + '<div class="ini">'+esc(p.name.slice(0,1))+'</div>'
        + '<div><div class="nm">'+esc(p.name)+'</div>'
        + '<div class="sub">'+(n?n+'번 기록':'아직 기록 없음')
        + (p.next&&p.next.date?' · 다음 '+mdShort(p.next.date):'')+'</div></div>'
        + '<div class="go">›</div></div>';
    });
  }
  h += '<div class="gap"></div><button class="btn day" data-go="add">＋ 이름 추가</button></div>';
  return h;
}
function scAdd(){
  return head('이름 추가','list')
    + '<div class="pad"><div class="q">누구에게 전하시겠어요?</div>'
    + '<p class="hint">이름만 적으면 됩니다.</p>'
    + '<input id="addName" class="inp" placeholder="예: 김정숙">'
    + '<div class="gap"></div><div class="gap"></div>'
    + '<button class="btn day" id="addGo">명단에 넣기</button></div>';
}

/* 사람 상세 */
function scPerson(){
  var p=person(V.pid); if(!p) return scList();
  var h = head(p.name,'list');
  h += '<div class="pad">';
  h += '<button class="btn day" data-start="'+p.id+'">오늘 만난 기록 남기기</button><div class="gap"></div>';
  if(p.next && p.next.date){
    h += '<div class="note"><b>다음 만남 · '+md(p.next.date)+'</b><p>'
      + (p.next.note?esc(p.next.note):'메모 없음')+'</p></div>';
  }
  var logs=(p.logs||[]).slice().sort(function(a,b){return a.date<b.date?1:-1;});
  if(!logs.length){
    h += '<p class="hint">아직 기록이 없습니다.</p>';
  }else{
    logs.forEach(function(l){
      var d=dayOf(l.date);
      h += '<div class="rec" style="--day:'+d.c+'"><div class="dt">'+md(l.date)+' '+d.s+'요일</div>';
      if(l.mine)   h += '<div class="ln"><b>내가</b> '+esc(l.mine)+'</div>';
      if(l.theirs) h += '<div class="ln"><b>상대</b> '+esc(l.theirs)+'</div>';
      h += '<div class="tags">'
        + (l.photo?'<span>사진</span>':'')
        + '<span>만남</span>'
        + (l.talk?'<span>대화</span>':'')
        + (l.kakao?'<span>카톡초대</span>':'')
        + (l.seminar?'<span>세미나초대</span>':'')
        + '</div>'
        + '<div class="gap"></div><button class="btn g s" data-recard="'+p.id+':'+l.id+'">이 기록 카드 만들기</button>'
        + '</div>';
    });
  }
  h += '<div class="gap"></div><button class="btn g s" data-del="'+p.id+'">명단에서 지우기</button></div>';
  return h;
}

/* 기록 스텝 1~5 */
function scS1(){
  return head('전달 기록','person','1/5')
    + '<div class="pad"><div class="pill">'+esc(V.draft.name)+'</div>'
    + '<div class="q">내가 뭐라고<br>말했나요?</div>'
    + '<p class="hint">건넬 때 한 말을 한 줄로 적어두세요.<br>나중에 이어서 이야기할 때 큰 도움이 됩니다.</p>'
    + '<textarea id="f1" class="ta" rows="4" placeholder="예: 3일치니까 물에 타서 하루 한 번만 드시라고 했어요">'+esc(V.draft.mine)+'</textarea>'
    + '<div class="gap"></div><div class="gap"></div>'
    + '<button class="btn day" data-next="s2">다음</button></div>';
}
function scS2(){
  return head('전달 기록','s1','2/5')
    + '<div class="pad"><div class="pill">'+esc(V.draft.name)+'</div>'
    + '<div class="q">상대는 뭐라고<br>하던가요?</div>'
    + '<p class="hint">들은 말을 그대로 적으세요.<br>별 반응이 없었으면 없었다고 적으셔도 됩니다.</p>'
    + '<textarea id="f2" class="ta" rows="4" placeholder="예: 향이 좋다고 했어요. 아침에 쓰기 편하대요">'+esc(V.draft.theirs)+'</textarea>'
    + '<div class="gap"></div><div class="gap"></div>'
    + '<button class="btn day" data-next="s3">다음</button></div>';
}
function scS3(){
  var d=V.draft;
  return head('전달 기록','s2','3/5')
    + '<div class="pad"><div class="q">오늘 무엇을<br>하셨나요?</div>'
    + '<p class="hint">해당되는 것만 누르세요.</p>'
    + row('talk','대화를 나눴어요', d.talk)
    + row('kakao','카톡방에 초대했어요', d.kakao)
    + row('seminar','세미나에 초대했어요', d.seminar)
    + '<div class="gap"></div><div class="gap"></div>'
    + '<button class="btn day" data-next="s4">다음</button></div>';
}
function row(k,label,on){
  return '<div class="chk '+(on?'on':'')+'" data-chk="'+k+'">'
    + '<div class="bx">'+(on?'✓':'')+'</div><div class="lb">'+label+'</div></div>';
}
function scS4(){
  var d=V.draft;
  return head('전달 기록','s3','4/5')
    + '<div class="pad"><div class="q">사진이 있으면<br>넣어주세요</div>'
    + '<p class="hint">없어도 괜찮습니다. 건너뛰셔도 돼요.</p>'
    + (d.photo
        ? '<img src="'+d.photo+'" class="photo"><div class="gap"></div>'
          + '<div class="row"><button class="btn g s" id="reCam">다시 찍기</button>'
          + '<button class="btn g s" id="rePick">앨범</button>'
          + '<button class="btn g s" id="rmPhoto">지우기</button></div>'
        : '<div class="drop"><b>사진 (선택)</b>'
          + '<div class="row"><button class="btn day s" id="doCam">사진 찍기</button>'
          + '<button class="btn g s" id="doPick">앨범에서</button></div></div>')
    + '<div class="gap"></div><div class="gap"></div>'
    + '<button class="btn day" data-next="s5">다음</button></div>';
}
function scS5(){
  var d=V.draft;
  return head('전달 기록','s4','5/5')
    + '<div class="pad"><div class="q">다음에 언제<br>만나시겠어요?</div>'
    + '<p class="hint">정해두면 홈 화면에서 알려드립니다. 비워두셔도 됩니다.</p>'
    + '<input id="nd" type="date" class="inp" value="'+(d.nextDate||'')+'">'
    + '<div class="gap"></div>'
    + '<input id="nn" class="inp" placeholder="메모 (예: 요가 끝나고)" value="'+esc(d.nextNote||'')+'">'
    + '<div class="gap"></div><div class="gap"></div>'
    + '<button class="btn day" id="finish">저장하고 카드 만들기</button></div>';
}

/* 3. 다음 만남 */
function scNext(){
  var h=head('다음 만남','home')+'<div class="pad">';
  var list=S.people.filter(function(p){return p.next&&p.next.date;})
    .sort(function(a,b){return a.next.date>b.next.date?1:-1;});
  if(!list.length){
    h+='<div class="note"><b>정해둔 약속이 없어요</b><p>전달 기록을 남길 때 마지막 화면에서 '
      +'다음 만날 날을 정하면 여기에 모입니다.</p></div>';
  }else{
    list.forEach(function(p){
      var dd=dayOf(p.next.date), late = p.next.date < today();
      h+='<div class="item" data-person="'+p.id+'" style="border-color:'+(late?dd.c:'var(--line)')+'">'
        + '<div class="ini" style="background:'+dd.c+';color:'+dd.on+'">'+dd.s+'</div>'
        + '<div><div class="nm">'+esc(p.name)+'</div>'
        + '<div class="sub">'+md(p.next.date)+(p.next.note?' · '+esc(p.next.note):'')
        + (late?' · 지났어요':'')+'</div></div><div class="go">›</div></div>';
    });
  }
  return h+'</div>';
}

/* ═══ 카드 그리기 ═══ */
function loadImg(src){
  return new Promise(function(r){
    if(!src){ r(null); return; }
    var done=false, i=new Image();
    var fin=function(v){ if(!done){ done=true; r(v); } };
    i.onload=function(){ fin(i); };
    i.onerror=function(){ fin(null); };
    setTimeout(function(){ fin(null); }, 5000);   /* 안 뜨면 사진 없이 진행 */
    i.src=src;
  });
}

async function drawCard(p, l){
  var CF='"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
  var day=dayOf(l.date);
  var W=1080, cv=document.createElement('canvas'), ctx=cv.getContext('2d');
  var img = l.photo ? await loadImg(l.photo) : null;
  var prod = await loadImg(product());

  function wrap(t,max,size,weight){
    ctx.font=(weight||400)+' '+size+'px '+CF; var out=[];
    String(t).split('\n').forEach(function(par){
      var line='';
      for(var i=0;i<par.length;i++){ var c=par[i];
        if(ctx.measureText(line+c).width>max){ out.push(line); line=c; } else line+=c; }
      out.push(line);
    });
    return out;
  }
  /* 글자가 칸을 넘으면 자동으로 조금 줄입니다 */
  function fitFont(t,max,size,weight){
    var s=size;
    while(s>size*0.62){
      ctx.font=(weight||800)+' '+s+'px '+CF;
      if(ctx.measureText(t).width<=max) break;
      s-=2;
    }
    return s;
  }

  var mineL  = l.mine   ? wrap(l.mine,930,51)   : [];
  var theirL = l.theirs ? wrap(l.theirs,930,51) : [];
  var items = [
    {t:'사진',       on:!!l.photo},
    {t:'만난 사람',   on:true},
    {t:'언급한 대화', on:!!l.talk},
    {t:'카톡 초대',   on:!!l.kakao},
    {t:'세미나 초대', on:!!l.seminar}
  ];

  var HD=408;
  var H = HD;
  if(img) H += 700;
  H += 178;                        /* 이름 */
  H += items.length*100 + 44;
  if(mineL.length)  H += 84 + mineL.length*72 + 34;
  if(theirL.length) H += 84 + theirL.length*72 + 34;
  H += 160;
  cv.width=W; cv.height=H;

  function round(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  ctx.fillStyle='#FBFAF7'; ctx.fillRect(0,0,W,H);

  /* ── 요일 색 헤더 ── */
  ctx.fillStyle=day.c; ctx.fillRect(0,0,W,HD);
  ctx.globalAlpha=.14; ctx.fillStyle='#FFFFFF';
  ctx.beginPath(); ctx.arc(1030,20,235,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;

  /* 제품 사진 (오른쪽 아래) */
  if(prod){
    var ps=196, px=W-70-ps, py=172;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.24)'; ctx.shadowBlur=24; ctx.shadowOffsetY=7;
    ctx.fillStyle='#FFFFFF'; round(px-10,py-10,ps+20,ps+20,28); ctx.fill();
    ctx.restore();
    ctx.save(); round(px,py,ps,ps,20); ctx.clip();
    var sc=Math.max(ps/prod.width, ps/prod.height);
    var pw2=prod.width*sc, ph2=prod.height*sc;
    ctx.drawImage(prod, px+(ps-pw2)/2, py+(ps-ph2)/2, pw2, ph2);
    ctx.restore();
  }

  ctx.fillStyle=day.on;
  var eb='미나사(미네랄을 나누는 사람들) 챌린지';
  var ebs=fitFont(eb,940,54,800);
  ctx.font='800 '+ebs+'px '+CF;
  ctx.fillText(eb,70,116);

  ctx.font='800 108px '+CF;
  ctx.fillText(md(l.date),70,262);
  ctx.globalAlpha=.95; ctx.font='800 60px '+CF;
  ctx.fillText(day.k+' · '+(S.me||'나')+'님',70,350); ctx.globalAlpha=1;

  var y=HD;

  /* ── 사용자 사진 ── */
  if(img){
    var bx=70,bw=W-140,bh=620;
    ctx.save(); round(bx,y+40,bw,bh,30); ctx.clip();
    var s2=Math.max(bw/img.width,bh/img.height), dw=img.width*s2, dh=img.height*s2;
    ctx.drawImage(img, bx+(bw-dw)/2, y+40+(bh-dh)/2, dw, dh);
    ctx.restore(); y+=700;
  }

  /* ── 만난 사람 ── */
  var title=p.name+'님을 만났어요';
  var ts=fitFont(title,940,93,800);
  ctx.fillStyle='#0F3D3A'; ctx.font='800 '+ts+'px '+CF;
  ctx.fillText(title,70,y+112);
  y+=178;

  /* ── 체크 ── */
  items.forEach(function(it,i){
    var cy=y+i*100;
    ctx.fillStyle = it.on?day.c:'#E6ECEB';
    ctx.beginPath(); ctx.arc(106,cy+34,34,0,Math.PI*2); ctx.fill();
    if(it.on){ ctx.strokeStyle=day.on; ctx.lineWidth=8; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath(); ctx.moveTo(89,cy+34); ctx.lineTo(101,cy+47); ctx.lineTo(124,cy+20); ctx.stroke(); }
    ctx.fillStyle = it.on?'#0F3D3A':'#B3C1BF';
    ctx.font=(it.on?800:500)+' 60px '+CF;
    ctx.fillText(it.t,170,cy+54);
  });
  y+=items.length*100+44;

  function block(label,lines){
    ctx.fillStyle=day.c; ctx.font='800 42px '+CF; ctx.fillText(label,70,y+48); y+=84;
    ctx.fillStyle='#3A4F4D'; ctx.font='400 51px '+CF;
    lines.forEach(function(t,i){ ctx.fillText(t,70,y+i*72+50); });
    y+=lines.length*72+34;
  }
  if(mineL.length)  block('내가 한 말',mineL);
  if(theirL.length) block('상대가 한 말',theirL);

  /* ── 푸터 ── */
  ctx.fillStyle='#EDF2F1'; ctx.fillRect(0,H-160,W,160);
  ctx.fillStyle=day.c; ctx.font='800 45px '+CF;
  ctx.fillText('미네랄을 나누는 사람들',70,H-62);
  if(p.next && p.next.date){
    ctx.fillStyle='#83918F'; ctx.font='600 42px '+CF;
    var nx='다음 '+mdShort(p.next.date);
    ctx.fillText(nx, W-70-ctx.measureText(nx).width, H-62);
  }
  return cv.toDataURL('image/png');
}

/* 집계용 글 */
function summaryText(p,l){
  var d=dayOf(l.date);
  var o = function(b){ return b?'O':'X'; };
  return '#미나사 '+(S.me||'나')+' '+mdShort(l.date)+'('+d.s+')\n'
    + '만난 사람 : '+p.name+'\n'
    + '사진'+o(!!l.photo)+' 대화'+o(!!l.talk)+' 카톡초대'+o(!!l.kakao)+' 세미나초대'+o(!!l.seminar);
}

async function showCard(p,l){
  V.screen='card'; render();
  var url = await drawCard(p,l);
  V.copyText = summaryText(p,l);
  document.getElementById('cardWrap').innerHTML =
    '<img src="'+url+'" style="width:100%;border-radius:18px;display:block;box-shadow:0 8px 26px rgba(15,61,58,.16)">'
    + '<div class="gap"></div><div class="gap"></div>'
    + '<button class="btn day" id="shareBtn">카톡에 올리기</button>'
    + '<p class="mini"><b>누르면 글이 자동으로 복사됩니다.</b><br>'
    + '단톡방에 사진을 보낸 다음, 입력창을 꾹 눌러 <b>붙여넣기</b> 한 번만 더 해주세요.<br>'
    + '사진과 글이 둘 다 있어야 집계가 됩니다.</p>'
    + '<div class="gap"></div>'
    + '<button class="btn g" data-go="copy">글이 복사가 안 됐어요</button>';
  bind();
  document.getElementById('shareBtn').onclick=function(){ shareImg(url, p.name, V.copyText); };
}

async function shareImg(url,name,text){
  /* 손가락을 뗀 순간 바로 복사해야 붙여넣기가 됩니다 */
  var copied = copyNow(text);
  try{
    var blob = await (await fetch(url)).blob();
    var file = new File([blob], '미나사.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], text:text});
      toast(copied ? '사진 보낸 뒤 붙여넣기 하세요' : '글은 아래 버튼으로 복사하세요');
      return;
    }
  }catch(e){}
  var a=document.createElement('a'); a.href=url; a.download='미나사_'+name+'.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast(copied ? '사진 저장 · 글도 복사했어요' : '사진을 저장했어요');
}

/* 즉시(동기) 복사 — 성공 여부를 돌려줍니다 */
function copyNow(t){
  var ok=false;
  try{
    var ta=document.createElement('textarea');
    ta.value=t; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.top='0'; ta.style.left='0';
    ta.style.opacity='0'; ta.style.fontSize='16px';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, t.length);
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){ ok=false; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{ navigator.clipboard.writeText(t).then(function(){},function(){}); ok=true; }catch(e){}
  }
  return ok;
}

function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast('복사했어요');},function(){fb(t);});
  } else fb(t);
  function fb(x){
    var ta=document.createElement('textarea'); ta.value=x;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('복사했어요'); }catch(e){ toast('복사가 안 됐어요'); }
    document.body.removeChild(ta);
  }
}

/* 사진 입력 */
function askPhoto(useCam){
  var el = document.getElementById(useCam?'camIn':'fileIn');
  el.value=''; el.click();
}
function hookPhoto(){
  ['camIn','fileIn'].forEach(function(id){
    document.getElementById(id).onchange=function(e){
      var f=e.target.files && e.target.files[0]; if(!f||!V.draft) return;
      var r=new FileReader();
      r.onload=function(){
        var im=new Image();
        im.onload=function(){
          var max=1400, sc=Math.min(1,max/Math.max(im.width,im.height));
          var cv=document.createElement('canvas');
          cv.width=im.width*sc; cv.height=im.height*sc;
          cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
          V.draft.photo=cv.toDataURL('image/jpeg',0.82);
          render();
        };
        im.onerror=function(){ toast('사진을 읽지 못했어요'); };
        im.src=r.result;
      };
      r.readAsDataURL(f);
    };
  });
}

/* ═══ 이벤트 ═══ */
function bind(){
  var app=document.getElementById('app');

  var ni=document.getElementById('nameIn');
  if(ni){
    document.getElementById('nameGo').onclick=function(){
      var v=ni.value.trim(); if(!v) return; S.me=v; save(); go('home');
    };
    ni.onkeydown=function(e){ if(e.key==='Enter') document.getElementById('nameGo').click(); };
  }
  var ib=document.getElementById('instNow');
  if(ib) ib.onclick=function(){
    if(window.__bip){
      window.__bip.prompt();
      window.__bip.userChoice.then(function(r){
        if(r && r.outcome==='accepted'){ try{localStorage.setItem('minasa2:noinst','1');}catch(e){} go('home'); }
      });
      window.__bip=null;
    } else {
      toast(isIOS() ? '아래 공유 버튼을 눌러 주세요' : '오른쪽 위 ⋮ 를 눌러 주세요');
    }
  };
  var ino=document.getElementById('instNo');
  if(ino) ino.onclick=function(){ try{localStorage.setItem('minasa2:noinst','1');}catch(e){} go('home'); };

  var rn=document.getElementById('resetName');
  if(rn) rn.onclick=function(){ S.me=''; save(); go('home'); };

  app.querySelectorAll('[data-go]').forEach(function(el){
    el.onclick=function(){
      var t=el.getAttribute('data-go');
      if(t==='pickPerson'){
        if(!S.people.length){ toast('먼저 명단을 만들어 주세요'); go('list'); return; }
        go('list'); return;
      }
      if(t==='person'){ go('person'); return; }
      go(t);
    };
  });

  var an=document.getElementById('addName');
  if(an){
    an.focus();
    document.getElementById('addGo').onclick=function(){
      var v=an.value.trim(); if(!v) return;
      S.people.push({id:uid(),name:v,logs:[],next:null}); save(); go('list');
    };
    an.onkeydown=function(e){ if(e.key==='Enter') document.getElementById('addGo').click(); };
  }

  app.querySelectorAll('[data-person]').forEach(function(el){
    el.onclick=function(){ go('person', el.getAttribute('data-person')); };
  });

  app.querySelectorAll('[data-start]').forEach(function(el){
    el.onclick=function(){
      var p=person(el.getAttribute('data-start'));
      V.draft={pid:p.id,name:p.name,date:today(),mine:'',theirs:'',
               talk:false,kakao:false,seminar:false,photo:null,
               nextDate:(p.next&&p.next.date)||'',nextNote:(p.next&&p.next.note)||''};
      go('s1');
    };
  });

  app.querySelectorAll('[data-del]').forEach(function(el){
    el.onclick=function(){
      S.people=S.people.filter(function(x){return x.id!==el.getAttribute('data-del');});
      save(); go('list');
    };
  });

  app.querySelectorAll('[data-recard]').forEach(function(el){
    el.onclick=function(){
      var v=el.getAttribute('data-recard').split(':');
      var p=person(v[0]); var l=(p.logs||[]).filter(function(x){return x.id===v[1];})[0];
      if(p&&l) showCard(p,l);
    };
  });

  var f1=document.getElementById('f1'); if(f1){ f1.focus(); f1.oninput=function(){V.draft.mine=this.value;}; }
  var f2=document.getElementById('f2'); if(f2){ f2.focus(); f2.oninput=function(){V.draft.theirs=this.value;}; }

  app.querySelectorAll('[data-chk]').forEach(function(el){
    el.onclick=function(){
      var k=el.getAttribute('data-chk');
      V.draft[k]=!V.draft[k]; render();
    };
  });

  app.querySelectorAll('[data-next]').forEach(function(el){
    el.onclick=function(){ go(el.getAttribute('data-next')); };
  });

  ['doCam','reCam'].forEach(function(id){ var e=document.getElementById(id);
    if(e) e.onclick=function(){ askPhoto(true); }; });
  ['doPick','rePick'].forEach(function(id){ var e=document.getElementById(id);
    if(e) e.onclick=function(){ askPhoto(false); }; });
  var rm=document.getElementById('rmPhoto');
  if(rm) rm.onclick=function(){ V.draft.photo=null; render(); };

  var fin=document.getElementById('finish');
  if(fin){
    var nd=document.getElementById('nd'), nn=document.getElementById('nn');
    nd.onchange=function(){V.draft.nextDate=this.value;};
    nn.oninput=function(){V.draft.nextNote=this.value;};
    fin.onclick=function(){
      var d=V.draft, p=person(d.pid);
      var log={id:uid(),date:d.date,mine:d.mine.trim(),theirs:d.theirs.trim(),
               talk:d.talk,kakao:d.kakao,seminar:d.seminar,photo:d.photo};
      p.logs=p.logs||[]; p.logs.push(log);
      p.next = d.nextDate ? {date:d.nextDate, note:(d.nextNote||'').trim()} : p.next;
      save(); V.draft=null; V.pid=p.id;
      showCard(p,log);
    };
  }

  var dc=document.getElementById('doCopy');
  if(dc) dc.onclick=function(){ copyText(V.copyText||''); };
}

function cover(){
  var m=document.querySelector('meta[name="minasa-cover"]')
     || document.querySelector('meta[property="og:image"]');
  return m?m.getAttribute('content'):'';
}
function product(){
  var m=document.querySelector('meta[name="minasa-product"]');
  return m?m.getAttribute('content'):'';
}

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); window.__bip=e;
});
window.addEventListener('appinstalled', function(){
  try{localStorage.setItem('minasa2:noinst','1');}catch(e){} render();
});

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

load(); hookPhoto(); render();
</script>
